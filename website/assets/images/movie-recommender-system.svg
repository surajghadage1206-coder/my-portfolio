  <rect x="404" y="76" width="172" height="58" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
  <text x="418" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9AA4B8">QUERY SEARCH</text>
