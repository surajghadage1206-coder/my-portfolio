  <text x="38" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9AA4B8">TEXT VECTORIZER</text>
  <text x="38" y="118" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#E8EBF1">TF-IDF <tspan font-size="10" fill="#22D3EE">Matrix Model</tspan></text>

