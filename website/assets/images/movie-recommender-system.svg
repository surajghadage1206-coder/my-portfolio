  <!-- Background card with border -->
  <rect width="600" height="340" rx="14" fill="url(#movBgGrad)"/>
  <rect x="1" y="1" width="598" height="338" rx="13" fill="none" stroke="#232B3D" stroke-width="1.5"/>

