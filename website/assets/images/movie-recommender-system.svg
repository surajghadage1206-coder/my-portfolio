    <rect x="85" y="77" width="105" height="12" rx="3" fill="url(#movBarGrad1)"/>
    <text x="200" y="87" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#A78BFA">TF-IDF</text>

