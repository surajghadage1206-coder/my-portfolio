    <text x="254" y="97" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">91.3% Match</text>

    <!-- Rec 3 -->
    <rect x="14" y="110" width="252" height="26" rx="5" fill="#101726" stroke="#1F293D" stroke-width="1"/>
    <circle cx="28" cy="123" r="7" fill="#8B5CF6"/>
    <text x="28" y="126" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="44" y="127" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#E8EBF1">Iron Man 3</text>
    <text x="254" y="127" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#A78BFA" text-anchor="end">88.5% Match</text>

    <!-- Rec 4 -->
    <rect x="14" y="140" width="252" height="24" rx="5" fill="#101726" stroke="#1F293D" stroke-width="1"/>
    <circle cx="28" cy="152" r="6" fill="#64748B"/>
    <text x="28" y="155" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
