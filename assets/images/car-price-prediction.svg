<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="carBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#1B2233"/>
    </linearGradient>
    <linearGradient id="carLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGradCar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="barGradCar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background card with border -->
  <rect width="600" height="340" rx="14" fill="url(#carBgGrad)"/>
  <rect x="1" y="1" width="598" height="338" rx="13" fill="none" stroke="#232B3D" stroke-width="1.5"/>

  <!-- Top Window Header Bar -->
  <rect x="24" y="20" width="552" height="44" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
  <circle cx="46" cy="42" r="5" fill="#EF4444"/>
  <circle cx="62" cy="42" r="5" fill="#F59E0B"/>
  <circle cx="78" cy="42" r="5" fill="#10B981"/>
  <text x="100" y="46" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#9AA4B8">CAR_PRICE_PREDICTION_REGRESSION.IPYNB</text>
  <rect x="440" y="30" width="120" height="24" rx="12" fill="rgba(34, 211, 238, 0.15)"/>
  <text x="500" y="46" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="middle">ML REGRESSION</text>

  <!-- Metric Tile 1: Model Types -->
  <rect x="24" y="76" width="170" height="58" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
  <text x="38" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9AA4B8">ALGORITHMS</text>
  <text x="38" y="118" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#E8EBF1">Random Forest <tspan font-size="10" fill="#22D3EE">&amp; OLS</tspan></text>

  <!-- Metric Tile 2: Metrics -->
  <rect x="214" y="76" width="170" height="58" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
  <text x="228" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9AA4B8">EVALUATION METRICS</text>
  <text x="228" y="118" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#22D3EE">R&#178; <tspan font-size="12" fill="#E8EBF1">&amp; MAE Score</tspan></text>

  <!-- Metric Tile 3: Key Target -->
  <rect x="404" y="76" width="172" height="58" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
  <text x="418" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9AA4B8">PREDICTION TARGET</text>
  <text x="418" y="118" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#3B82F6">Selling Price <tspan font-size="10" fill="#10B981">&#8377; Lakhs</tspan></text>

  <!-- Main Chart Canvas Left: Regression Curve & Scatter -->
  <g transform="translate(24, 146)">
    <rect width="280" height="172" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E8EBF1">Predicted vs Actual Price</text>
    <text x="16" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Linear &amp; Non-linear Fit Residuals</text>

    <!-- Grid lines -->
    <line x1="25" y1="55" x2="255" y2="55" stroke="#1F293D" stroke-dasharray="3 3"/>
    <line x1="25" y1="85" x2="255" y2="85" stroke="#1F293D" stroke-dasharray="3 3"/>
    <line x1="25" y1="115" x2="255" y2="115" stroke="#1F293D" stroke-dasharray="3 3"/>
    <line x1="25" y1="145" x2="255" y2="145" stroke="#1F293D" stroke-width="1.2"/>
    <line x1="25" y1="50" x2="25" y2="145" stroke="#1F293D" stroke-width="1.2"/>

    <!-- Regression Fit Line -->
    <line x1="30" y1="138" x2="245" y2="58" stroke="url(#carLineGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Scatter Points (Predicted vs Actual) -->
    <circle cx="45" cy="132" r="3.5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="65" cy="120" r="3.5" fill="#22D3EE" opacity="0.9"/>
    <circle cx="85" cy="115" r="4" fill="#38BDF8" opacity="0.85"/>
    <circle cx="105" cy="108" r="3.5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="120" cy="98" r="4" fill="#22D3EE" opacity="0.9"/>
    <circle cx="140" cy="105" r="3.5" fill="#60A5FA" opacity="0.8"/>
    <circle cx="160" cy="85" r="4" fill="#38BDF8" opacity="0.9"/>
    <circle cx="180" cy="78" r="3.5" fill="#22D3EE" opacity="0.85"/>
    <circle cx="205" cy="72" r="4" fill="#3B82F6" opacity="0.9"/>
    <circle cx="225" cy="62" r="4.5" fill="#22D3EE" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- Axis Labels -->
    <text x="35" y="157" font-family="'Inter', sans-serif" font-size="8" fill="#64748B">&#8377;0L</text>
    <text x="100" y="157" font-family="'Inter', sans-serif" font-size="8" fill="#64748B">&#8377;5L</text>
    <text x="170" y="157" font-family="'Inter', sans-serif" font-size="8" fill="#64748B">&#8377;15L</text>
    <text x="240" y="157" font-family="'Inter', sans-serif" font-size="8" fill="#22D3EE" font-weight="600">&#8377;30L+</text>
  </g>

  <!-- Main Chart Canvas Right: Feature Significance & EDA -->
  <g transform="translate(318, 146)">
    <rect width="258" height="172" rx="8" fill="#0F1524" stroke="#232B3D" stroke-width="1"/>
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E8EBF1">Feature Importance &amp; EDA</text>
    <text x="16" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Top Predictors for Valuation</text>

    <!-- Bar 1: Present_Price -->
    <text x="16" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Present Price</text>
    <rect x="85" y="52" width="125" height="12" rx="3" fill="url(#barGradCar2)"/>
    <text x="220" y="62" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#22D3EE">48.2%</text>

    <!-- Bar 2: Year of Manufacture -->
    <text x="16" y="87" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Year / Age</text>
    <rect x="85" y="77" width="85" height="12" rx="3" fill="url(#barGradCar1)"/>
    <text x="180" y="87" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#3B82F6">24.6%</text>

    <!-- Bar 3: Fuel Type (Diesel/Petrol) -->
    <text x="16" y="112" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Fuel Type</text>
    <rect x="85" y="102" width="55" height="12" rx="3" fill="url(#barGradCar2)"/>
    <text x="150" y="112" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#22D3EE">14.1%</text>

    <!-- Bar 4: Transmission Type -->
    <text x="16" y="137" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Transmission</text>
    <rect x="85" y="127" width="38" height="12" rx="3" fill="url(#barGradCar1)"/>
    <text x="133" y="137" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#3B82F6">8.5%</text>

    <!-- Bar 5: Driven Kms -->
    <text x="16" y="160" font-family="'Inter', sans-serif" font-size="9" fill="#9AA4B8">Driven Kms</text>
    <rect x="85" y="150" width="24" height="12" rx="3" fill="#64748B"/>
    <text x="118" y="160" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#9AA4B8">4.6%</text>
  </g>
</svg>